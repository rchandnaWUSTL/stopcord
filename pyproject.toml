[project]
name = "stopcord"
version = "0.1.0"
description = "A containment layer for AI agents: policy gate, hash-chained log, kill switch, replay."
readme = "README.md"
authors = [
    { name = "Roshan Chandna", email = "45045902+rchandnaWUSTL@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.20",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
stopcord = "stopcord.cli:app"

[project.optional-dependencies]
agent = []

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
